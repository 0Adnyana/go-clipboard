name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PRs cancel stale runs. Never cancel main: a workflow-level cancel would
  # abort publish-and-deploy's SSH session even though that job sets
  # cancel-in-progress: false.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/go-clipboard

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend deps
        run: cd web && pnpm install --frozen-lockfile

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: sqlc drift check
        run: |
          sqlc generate
          if ! git diff --quiet -- internal/db; then
            echo "sqlc generate produced a diff; commit the regenerated code" >&2
            git diff -- internal/db
            exit 1
          fi

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: go-clipboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          chmod +x deploy/smoke-test.sh
          ./deploy/smoke-test.sh go-clipboard:ci

      - name: Save image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker save go-clipboard:ci | gzip > /tmp/image.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          name: image
          path: /tmp/image.tar.gz
          retention-days: 1

  publish-and-deploy:
    name: Publish and deploy
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Serialize default-branch deploys so only one runs at a time.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - name: Load image
        run: gunzip -c /tmp/image.tar.gz | docker load

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push SHA and latest tags
        id: push
        env:
          SHA: ${{ github.sha }}
        run: |
          DEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker tag go-clipboard:ci "${DEST}:${SHA}"
          docker tag go-clipboard:ci "${DEST}:latest"
          docker push "${DEST}:${SHA}"
          docker push "${DEST}:latest"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${DEST}:${SHA}" | cut -d@ -f2)"
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "image=${DEST}@${DIGEST}" >>"$GITHUB_OUTPUT"
          echo "sha_image=${DEST}:${SHA}" >>"$GITHUB_OUTPUT"

      - name: Guard deploy image digest
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          # Deploy by digest only. The SHA tag is a pointer, not the identity.
          if [[ "$IMAGE" != *@sha256:* ]]; then
            echo "refusing non-digest deploy image: $IMAGE" >&2
            exit 1
          fi
          digest="${IMAGE##*@}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "refusing malformed digest: $IMAGE" >&2
            exit 1
          fi
          if [[ "$IMAGE" == *:latest || "$IMAGE" == */latest || "$IMAGE" == latest ]]; then
            echo "refusing moving tag: $IMAGE" >&2
            exit 1
          fi

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          # The action already passes --accept-routes to `tailscale up`, which
          # is what lets us reach a Compose host on a LAN IP behind a subnet
          # router. Passing it again via `args` makes `tailscale up` fail.
          tags: tag:ci

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # tr -d '\r' saves a CRLF-pasted secret from failing as "invalid format".
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/known_hosts ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Fail closed if known_hosts still has no real key entries.
          if ! grep -qvE '^\s*(#|$)' ~/.ssh/known_hosts; then
            echo "deploy/known_hosts has no host keys; pin the production host before deploying" >&2
            exit 1
          fi
          # Reject a malformed, passphrase-protected, or public-half-only secret
          # here rather than as an opaque "Permission denied" at the first ssh.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 </dev/null > ~/.ssh/id_ed25519.pub; then
            echo "DEPLOY_SSH_KEY is not a usable unencrypted private key" >&2
            exit 1
          fi
          # The public half is not a secret, and printing it is the only way to
          # compare CI's key against the host's authorized_keys from a failed run.
          echo "deploy key offered by CI:"
          cat ~/.ssh/id_ed25519.pub
          ssh-keygen -lf ~/.ssh/id_ed25519.pub
          {
            echo "Host production"
            echo "  HostName ${DEPLOY_HOST}"
            echo "  User ${{ secrets.DEPLOY_USER }}"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            # A runner has no TTY, so any fallback to password auth is a
            # guaranteed failure that only obscures the real publickey error.
            echo "  PreferredAuthentications publickey"
            echo "  BatchMode yes"
            echo "  NumberOfPasswordPrompts 0"
            echo "  ConnectTimeout 15"
          } > ~/.ssh/config

      - name: Verify SSH auth
        run: |
          if ssh production true; then
            echo "publickey auth ok"
            exit 0
          fi
          echo "::error::SSH publickey auth to the production host failed. Re-run of the auth handshake follows."
          # Verbose retry: names the key CI offered and what the server accepts.
          ssh -v production true || true
          cat >&2 <<'EOF'
          Host-side checks, as a sudo-capable user on the Compose host. KEY is the
          fingerprint the Configure SSH step printed above.
            1. ssh-keygen -lf ~DEPLOY_USER/.ssh/authorized_keys   # must list KEY
            2. ls -ld ~DEPLOY_USER ~DEPLOY_USER/.ssh ~DEPLOY_USER/.ssh/authorized_keys
               sshd StrictModes refuses a group/world-writable HOME; want .ssh 700, authorized_keys 600
            3. sudo sshd -T | grep -Ei 'pubkeyauth|authorizedkeysfile|allowusers|denyusers|allowgroups'
            4. sudo journalctl -u ssh -n 50   # the server-side reason for the refusal
          EOF
          exit 1

      - name: Sync compose and deploy scripts
        run: |
          ssh production 'mkdir -p /opt/go-clipboard'
          scp compose.yaml deploy/deploy.sh deploy/backup.sh deploy/restore.sh production:/opt/go-clipboard/
          ssh production 'chmod +x /opt/go-clipboard/deploy.sh /opt/go-clipboard/backup.sh /opt/go-clipboard/restore.sh'

      - name: Deploy over SSH
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          PREVIOUS="$(ssh production 'cat /opt/go-clipboard/deployed-sha 2>/dev/null || true')"
          PREV_ARG=""
          if [[ -n "$PREVIOUS" ]]; then
            if [[ "$PREVIOUS" == *@sha256:* ]]; then
              PREV_ARG="$PREVIOUS"
            elif [[ "$PREVIOUS" == sha256:* ]]; then
              PREV_ARG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${PREVIOUS}"
            elif [[ "$PREVIOUS" =~ ^[0-9a-f]{64}$ ]]; then
              PREV_ARG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:${PREVIOUS}"
            elif [[ "$PREVIOUS" =~ ^[0-9a-f]{40}$ ]]; then
              # leftover from SHA-tag deploys before digest pinning
              PREV_ARG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${PREVIOUS}"
            fi
          fi
          ssh production \
            "EXPECTED_PREVIOUS_SHA='${PREVIOUS}' IMAGE='${IMAGE}' /opt/go-clipboard/deploy.sh '${IMAGE}' ${PREV_ARG}"
