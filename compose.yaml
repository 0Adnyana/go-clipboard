# Production runtime behind an edge TLS terminator (e.g. Caddy on a VPS).
#
# The app serves plain HTTP on container port 8080, published on the host as
# APP_PORT. TLS, ACME, and the public hostname live at the edge; this stack is
# reached over a private path (Tailscale, LAN, etc.).
#
# Correctness of the sweeper, migration locking, and in-process rate-limiter
# state depends on exactly ONE app instance. Do not scale the app service.
#
# Secrets and host-specific values live in an env file on the host (or platform
# secrets), never in the image or this repository. Copy deploy/env.example to
# the host as `.env` next to this file (or set `env_file`) and fill it in.
#
# Logs go to stdout/stderr and are collected by the container runtime — there
# is no logging agent.
#
# The database ships bundled as the `postgres` service under the `bundled-db`
# profile. Setting DATABASE_URL in the host env file and dropping that profile
# points the app at an external or managed database instead.

name: go-clipboard

services:
  # Bundled database, enabled by the `bundled-db` Compose profile that
  # deploy/env.example sets. To run against a database outside this stack,
  # drop that profile and set DATABASE_URL in the host env file instead.
  postgres:
    profiles:
      - bundled-db
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipboard
      # Not marked required here: interpolation runs before profiles are
      # applied, so a required-marker would also fire when this service is
      # disabled for an external database. deploy.sh enforces it instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: go_clipboard
    volumes:
      # PG 18+ stores data under /var/lib/postgresql/<major>/docker — mount the
      # parent, not …/data (see docker-library/postgres#1259).
      - pgdata:/var/lib/postgresql
    # Not published to the host — reachable only on the private Compose network.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipboard -d go_clipboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Deploy and rollback MUST reference a content digest (CI) or a full commit
    # SHA tag (manual leftover). Never deploy the moving `latest` tag.
    image: ${IMAGE:?set IMAGE to registry/name@sha256:… or registry/name:<full-git-sha>}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        # Absent when the bundled-db profile is off (external database).
        required: false
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      # Set DATABASE_URL in the host env file to use a database outside this
      # stack; the default targets the bundled postgres service. This entry
      # must stay in sync with the fallback in deploy.sh, and it is listed
      # here rather than left to env_file because `environment` wins over
      # `env_file` — a bare env_file value would be silently ignored.
      DATABASE_URL: ${DATABASE_URL:-postgres://clipboard:${POSTGRES_PASSWORD:-}@postgres:5432/go_clipboard?sslmode=disable}
      # Immediate peer that may set X-Forwarded-For (edge proxy Tailscale/LAN IP).
      TRUSTED_PROXY: ${TRUSTED_PROXY:?set TRUSTED_PROXY to the edge proxy IP}
      PORT: "8080"
    # The container always listens on 8080; APP_PORT is the host-side published
    # port and is what the edge proxy must target.
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - internal
    # Single replica only — see header comment. Do not scale this service.

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
